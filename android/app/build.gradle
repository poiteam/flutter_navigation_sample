plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { localProperties.load(it) }
}

android {
    namespace "com.poilabs.flutter_navigation_sample"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.poilabs.flutter_navigation_sample"
        // PoiLabs Navigation SDK requires API 24+
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        buildConfigField "String", "APPID", "\"${localProperties.getProperty("APPID", "")}\""
        buildConfigField "String", "APPSECRET", "\"${localProperties.getProperty("SECRET", "")}\""
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "com.github.poiteam:Android-Navigation-SDK:8.1.2"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
